name: CI/CD Habits

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Run linting (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 .

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test

  docker-build:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/habits:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/habits:latest

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      # 4. SSH в сервер для деплоя
      - name: SSH commands
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Ожидаем, что у вас настроен Docker на сервере
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}:latest
            docker stop habits || true
            docker rm habits || true
            docker run -d --name habits \
              --env-file /path/to/.env \
              --restart always \
              -p 8000:8000 \
              ${{ secrets.DOCKER_HUB_USERNAME }}:latest
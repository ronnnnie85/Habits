events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;

        client_max_body_size 50m;

         # Папка с простой index.html
        root /var/www/drf_homework_front;
        index index.html;

        # 1. Пытаемся отдать статический файл (index.html и др.)
        # Если файла нет — проксируем в Django (location @backend)
        location / {
            try_files $uri $uri/ @backend;
        }

        # Статика
        location /static/ {
            alias /app/staticfiles/;
        }

        # Медиа
        location /media/ {
            alias /app/media/;
        }

        # Прокси для Django
        location @backend {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}